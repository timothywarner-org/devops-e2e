apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-e2e
  namespace: devops-e2e
  labels:
    app: devops-e2e
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-e2e
  template:
    metadata:
      labels:
        app: devops-e2e
        version: v1
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: devops-e2e
        image: ghcr.io/timothywarner-org/devops-e2e:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL