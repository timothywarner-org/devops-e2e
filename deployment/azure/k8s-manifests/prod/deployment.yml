# DevOps E2E - Production Environment Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: devops-e2e-prod
  labels:
    environment: production
    app: devops-e2e
    managed-by: github-actions

---
# Production Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-e2e-app
  namespace: devops-e2e-prod
  labels:
    app: devops-e2e
    environment: production
    version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: devops-e2e
      environment: production
  template:
    metadata:
      labels:
        app: devops-e2e
        environment: production
        version: "1.0.0"
    spec:
      containers:
      - name: devops-e2e
        image: ghcr.io/timothywarner-org/devops-e2e:IMAGE_TAG
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: ALLOWED_ORIGINS
          value: "https://devops-e2e.example.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - devops-e2e
              topologyKey: kubernetes.io/hostname

---
# Production Service
apiVersion: v1
kind: Service
metadata:
  name: devops-e2e-service
  namespace: devops-e2e-prod
  labels:
    app: devops-e2e
    environment: production
spec:
  selector:
    app: devops-e2e
    environment: production
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  type: ClusterIP

---
# Production Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-e2e-ingress
  namespace: devops-e2e-prod
  labels:
    app: devops-e2e
    environment: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - devops-e2e.example.com
    secretName: devops-e2e-prod-tls
  rules:
  - host: devops-e2e.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devops-e2e-service
            port:
              number: 80

---
# Production ConfigMap for application settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-e2e-config
  namespace: devops-e2e-prod
  labels:
    app: devops-e2e
    environment: production
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  FEATURE_FLAG_NEW_UI: "false"

---
# Horizontal Pod Autoscaler for production
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-e2e-hpa
  namespace: devops-e2e-prod
  labels:
    app: devops-e2e
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-e2e-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

---
# Pod Disruption Budget for production high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devops-e2e-pdb
  namespace: devops-e2e-prod
  labels:
    app: devops-e2e
    environment: production
spec:
  selector:
    matchLabels:
      app: devops-e2e
      environment: production
  minAvailable: 2