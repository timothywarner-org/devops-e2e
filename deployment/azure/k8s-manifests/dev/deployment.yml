# DevOps E2E - Development Environment Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: devops-e2e-dev
  labels:
    environment: development
    app: devops-e2e
    managed-by: github-actions

---
# Development Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-e2e-app
  namespace: devops-e2e-dev
  labels:
    app: devops-e2e
    environment: development
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-e2e
      environment: development
  template:
    metadata:
      labels:
        app: devops-e2e
        environment: development
        version: "1.0.0"
    spec:
      containers:
      - name: devops-e2e
        image: ghcr.io/timothywarner-org/devops-e2e:IMAGE_TAG
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "3000"
        - name: ALLOWED_ORIGINS
          value: "https://devops-e2e-dev.example.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

---
# Development Service
apiVersion: v1
kind: Service
metadata:
  name: devops-e2e-service
  namespace: devops-e2e-dev
  labels:
    app: devops-e2e
    environment: development
spec:
  selector:
    app: devops-e2e
    environment: development
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  type: ClusterIP

---
# Development Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-e2e-ingress
  namespace: devops-e2e-dev
  labels:
    app: devops-e2e
    environment: development
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
  - hosts:
    - devops-e2e-dev.example.com
    secretName: devops-e2e-dev-tls
  rules:
  - host: devops-e2e-dev.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devops-e2e-service
            port:
              number: 80

---
# Development ConfigMap for application settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-e2e-config
  namespace: devops-e2e-dev
  labels:
    app: devops-e2e
    environment: development
data:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"
  FEATURE_FLAG_NEW_UI: "true"

---
# Horizontal Pod Autoscaler for development
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-e2e-hpa
  namespace: devops-e2e-dev
  labels:
    app: devops-e2e
    environment: development
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-e2e-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80